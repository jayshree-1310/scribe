# Production-style stack: compiled API, static web bundle behind nginx, no
# bind mounts and no dev dependencies in the images.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Values come from a root .env file (see .env.example). Nothing here has a
# development default for a secret on purpose: an unset secret should fail
# loudly rather than ship a known one.

name: scribe-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scribe}
      POSTGRES_USER: ${POSTGRES_USER:-scribe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-scribe} -d ${POSTGRES_DB:-scribe}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-scribe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scribe}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # nginx is the single hop in front of the API, so one forwarded address
      # can be trusted for rate-limit bucketing.
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        # Vite bakes VITE_* into the bundle, so this is a build-time input.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  api-migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scribe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scribe}
    working_dir: /app/apps/api
    command: ["pnpm", "exec", "prisma", "db", "migrate", "--yes"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
