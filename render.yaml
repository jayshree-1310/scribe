# Render blueprint — the deployed equivalent of docker-compose.prod.yml.
#
# Render has no Docker daemon inside a service, so Compose cannot run there:
# each Compose service becomes its own Render resource instead. `api` keeps its
# Dockerfile, and `web` becomes a static site rather than an nginx container
# (Render serves and CDN-caches the bundle itself, so the nginx hop buys
# nothing).
#
# Every resource here is on a free plan, which costs nothing and constrains
# three things: `postgres` is external because Render deletes free databases
# after 30 days, uploads do not persist because free instances cannot mount a
# disk, and the API sleeps after 15 minutes idle (~50s cold start).
#
# These three services already exist, created by hand (a project's New menu has
# no Blueprint entry). Names here match the live ones, so applying this adopts
# them rather than creating duplicates. Deployed 2026-09-15:
#
#   web  https://scribe-web-7mpz.onrender.com
#   api  https://scribe-new.onrender.com
#
# Steps, settings and the failures worth knowing about: docs/DEPLOYMENT.md

services:
  # --- redis ---------------------------------------------------------------
  - type: keyvalue
    name: scribe-redis
    plan: free
    # Reachable only from other services in this blueprint, never the internet.
    ipAllowList: []

  # --- api -----------------------------------------------------------------
  - type: web
    name: scribe-new
    runtime: docker
    # Context is the repo root because the Dockerfile copies the workspace
    # manifests (pnpm-workspace.yaml, both app package.json files).
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon's hostname carries both A and AAAA records. Node races the two
      # families (Happy Eyeballs) on a 250ms budget per address, so on a host
      # with no working IPv6 route every connection dies as a bogus
      # AggregateError [ETIMEDOUT] long before `connectionTimeoutMillis`.
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=2000
      # PORT is injected by Render; server.ts already reads it.

      # Render's own free Postgres is deleted after 30 days, so the database
      # lives on an external free provider instead. Paste Neon's pooled
      # connection string (it already carries `?sslmode=require`).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: scribe-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # --- Scribble ---------------------------------------------------
      # There is no model server here. Ollama is the local default and needs
      # gigabytes of RAM plus a disk to keep weights on; a free instance has
      # neither, so the deployed API answered every AI request with the "model
      # server not reachable" 503 until these were set.
      #
      # `openai` means any host speaking the OpenAI chat-completions format,
      # chosen by AI_BASE_URL rather than by vendor. Groq's free tier is the
      # cheapest way in and needs an account but no card:
      #
      #   AI_BASE_URL  https://api.groq.com/openai/v1
      #   AI_MODEL     llama-3.3-70b-versatile
      #
      # OpenRouter's free models work the same way:
      #
      #   AI_BASE_URL  https://openrouter.ai/api/v1
      #   AI_MODEL     meta-llama/llama-3.3-70b-instruct:free
      #
      # Leave AI_API_KEY unset and every AI route answers 503 and says so;
      # nothing else in the app is affected.
      - key: AI_PROVIDER
        value: openai
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      # Hosted inference is far quicker than a local CPU, so the local
      # two-minute default would only ever hide a hung request.
      - key: AI_TIMEOUT_MS
        value: "45000"

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: LOG_LEVEL
        value: info
      # Render's load balancer is the single hop in front of the API, so one
      # forwarded address can be trusted for rate-limit bucketing.
      - key: TRUST_PROXY
        value: "1"
      # No disk on a free instance, so this directory is wiped on every deploy
      # and on each spin-down. Uploaded avatars and video do not survive;
      # everything else is in Postgres and unaffected. `createStorage` in
      # lib/storage.ts is where an object-store backend would replace this.
      - key: UPLOAD_DIR
        value: /var/lib/scribe/uploads
      # The web app is on a different origin now, so avatar URLs the API hands
      # out must be absolute. Set to this service's own URL.
      - key: PUBLIC_UPLOAD_BASE_URL
        sync: false
      # The static site's origin, exactly: https://scribe-web-7mpz.onrender.com
      # No trailing slash — it is compared against the browser's Origin header
      # as a string. A blueprint cannot build it from `property: host`, so it is
      # set by hand.
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  # --- web -----------------------------------------------------------------
  - type: web
    name: scribe-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    envVars:
      # Vite inlines VITE_* at build time, so these are build inputs: changing
      # one needs a redeploy, not a restart.
      #
      # The API's base path, including /api:
      #   https://scribe-new.onrender.com/api
      # api-client.ts appends paths like /stories to this, so dropping the
      # suffix sends every call to the site's own origin instead.
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # Client-side routing: unknown paths are React Router's, not 404s.
      - type: rewrite
        source: /*
        destination: /index.html
