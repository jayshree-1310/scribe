services:
  postgres:
    image: postgres:17-alpine
    container_name: scribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scribe
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe_dev_password
    ports:
      - "1301:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d scribe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: scribe-redis
    restart: unless-stopped
    ports:
      - "1304:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: